schema_version: 1
status: draft
created_at: '2026-11-27'
owner: 数据组
purpose: R2常见问数与边界题草案；已有业务定义不重复审批，题目与预期行为待DS校对。
evaluation_boundary: 文件/引用/固定证据校验不等于Agent实测；未调用问数Agent、未生成R3通过结论。
reference_policy: reference是已保存证据中的历史值，固定其查询日期/快照范围，不声称今天重跑仍相同；不足以还原历史快照时先解释而非伪造。
cases:
- id: GQ-001
  domain: USR
  status: draft
  question: 按2026-11-25画像快照，2026-10-31全站注册用户数是多少？
  expected:
    behavior: answer
    metrics:
    - M-USR-001
    tables:
    - T-009
    checks:
    - 排除内部用户，is_registered=1，按注册日、user_id去重。
  reference:
    file: L5_evals/evidence/section06_user_ratios_result.json
    match:
      p_date: '20261031'
    values:
      signup_uv: 36769
    absolute_tolerance: 1.0e-09
  decision_sources:
  - review/Section08_用户域_整体锁定.md
- id: GQ-002
  domain: USR
  status: draft
  question: 2026-10-31全站访客UV是多少？
