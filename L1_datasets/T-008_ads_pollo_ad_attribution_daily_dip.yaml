id: T-008
table: mc_prd.ads_pollo_ad_attribution_daily_dip
domain: AD
purpose: 注册日 cohort 广告归因表（Section09 已确认纳入）：注册 cohort、注册日起算 D3/D7、支持范围内的 campaign/adgroup 下钻使用本表；默认投放日问题使用 T-010。用户/GMV 按注册日，消耗按花费日、安装按安装日，不能将日粒度成本比值解释为同批获客表现。
grain: 一行 = stat_date × source_end × ad_platform × campaign_id × adgroup_id × country × match_level × is_first_purchase × product_type
partition:
  field: p_date
  suffix: _dip
  read_rule: p_date = TO_CHAR(stat_date,'yyyymmdd')
default_filters:
  - is_first_purchase = '汇总' AND product_type = 'ALL'   # 主行：带消耗、安装、归因用户、GMV；其它行是首购 GMV 拆分行（P-33）
time_axis: stat_date 对 cohort_user_cnt 和 GMV 为注册日，对 cost_usd 为花费日，对 install_cnt 为安装日；金额/人数北京时间，消耗沿账户时区；渠道CAC按DS确认采用同日/同期成本与注册比率；生产旧说明建议周/月用于减小日期错位，不能把该建议当成DS未批准的日指标禁用规则。
key_fields:
  source_end: 投放端 WEB / APP
  ad_platform: google / meta / bing / tiktok / asa / naver / yandex / kwai 等
  match_level: 匹配层级 1/3/4/5，1 人钱皆有、3 有人无钱、4 有钱无人、5 只有安装；总量不过滤层级（P-34）
  cost_usd: 消耗（USD），只在 match_level 1、4 有值
  impressions / clicks: 展示、点击
  install_cnt: 安装数，只有 APP 有值，WEB 为空
  cohort_user_cnt: 归因用户数（cohort）
  gmv_usd_d0 ~ gmv_usd_d180: 归因用户 Dn 内累计 GMV，dN 只有在 stat_date + N ≤ 昨日时才完整（P-35）
  is_first_purchase: 汇总 / 1 / 0
  product_type: ALL / SUBSCRIPTION_NEW / API
traps: [P-33, P-34, P-35]
producer: CNB bigdata_etl main@29f97589bc61d7537844958bb646ea4e9fd4b052 pollo/02_数仓/广告域-广告投放归因/Sq_ads_pollo_ad_attribution_daily_dip.sql；口径见 ai_workspace/knowledge/legacy-caliber/ad-delivery.md。match_level：1 有钱有人 / 3 有人无钱 / 4 有钱无人 / 5 只有安装，看总量不要过滤
status: pending_review
owner: 数据组
evidence:
  - "2026-11-25 核查（2026-10 主行）：level 1 消耗 $638,861.24、归因用户 588,477、D0/D7/D30 GMV $354,155 / $505,895 / $621,241；level 4 只有消耗 $114,546.78；level 3 只有 GMV（D7 $46,159）；level 5 只有安装"
  - "2026-11-25 核查：行类型（汇总, ALL）401,958 行；（1, SUBSCRIPTION_NEW）7,923 行；（0, SUBSCRIPTION_NEW）190 行；API 6 行"
reviewed_by: DS
reviewed_at: "2026-11-27"
not_for:
  - 投放日 D3/D7；本表的 D3/D7 从注册日起算，不得静默替换。
  - 默认Web大盘CAC；其分子用T-010的Web成本，分母用T-009的Web总注册，不使用本表归因用户。
  - 把同日渠道CAC解释为同一批广告点击的转化成本；花费日和注册日不同，不承诺逐点击归因。
  - 未校准的campaign级成本比值；Web Google PMax/DG等须额外核验归因键。
