id: T-007
table: mc_prd.ods_pollo_log_event_dip
domain: USR
purpose: 前端埋点事件表，用于注册访问 UV（M-USR-008，Section 02 DS 确认）、自定义访客分析及入口渗透；创作任务指标仍取任务表，创作渗透率的访问分母取本表。
grain: 一行 = 一条埋点事件
primary_key: [record_id]
partition:
  field: p_date
  suffix: _dip
  read_rule: p_date 与 TO_CHAR(event_time,'yyyymmdd') 对齐（G-02）；单日去重 UV 即可，跨天不能直接相加
default_filters:
  - event_id IS NOT NULL     # 有效埋点（R0 U1）
time_axis: event_time（UTC+8，R0 B-09）
key_fields:
  anon_id: 匿名设备/浏览器 ID → 访客 UV（R0 U1）
  uid: 登录用户 ID。注册访问 UV 过滤 event_id IS NOT NULL、uid IS NOT NULL 且 uid <> ''，同日按 CAST(uid AS STRING) 去重（Section 02）
  platform_type / client_type: 端
  properties: 事件属性 JSON，用 GET_JSON_OBJECT 读取（v1 G-13）
  is_first_day: 是否首日访问
  entry_source / ad_id: 来源、广告 ID
traps: [P-14, P-15]
producer: 未核对（CNB 无权限）
status: pending_review
owner: 数据组
evidence:
  - "2026-11-25 核查（20261031，event_id 非空）：anon_id UV 144,168；uid UV 96,779；未登录 anon UV 113,914"
  - "Section 02，2026-11-26 DS：确认本表用于注册访问 UV，按非空 uid 去重，所有有效事件都算访问"
