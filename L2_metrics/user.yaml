# 用户域指标。登录 DAU 定义在支付域 M-PAY-012（唯一来源 T-002），这里不重复定义。
metrics:
  - id: M-USR-001
    name: 注册用户数
    synonyms: [注册数, 新注册, 当日注册, 注册量]
    definition: 注册日落在统计期内的已注册用户，排除内部用户。直接取用户画像表（R1 用户域第 2 版 DS，取代 R0 U2 的注册表）。
    table: T-009
    type: atomic
    expr: COUNT(DISTINCT user_id)
    filters: ["p_date = 昨日分区", "is_registered = 1", "COALESCE(is_internal_user_da, 0) <> 1", "TO_DATE(SUBSTR(CAST(register_date AS STRING),1,10),'yyyy-mm-dd') BETWEEN <期间起> AND <期间止>"]
    dedup_key: user_id
    unit: 人
    aggregation: total
    status: pending_review
    owner: 数据组
    evidence: ["2026-11-25 按本写法实跑：20261031 为 36,769；2026-10 全月 1,052,429（排除内部用户 18 个）", "20261031 与注册表、T-005 new_register_user_cnt 完全一致", "画像表 register_time 与 account_create_time 在 2026-10 注册用户上 100% 相同"]

  - id: M-USR-002
    name: 访客UV
    synonyms: [访问UV, 访客数, 匿名访客, 全量DAU, 访问用户]
    definition: 当日访客数，含未登录用户。默认取数仓已加工好的 T-005 dau 字段（R1 用户域 Q1）。只有分析以访客为目标人群、需要自定义事件过滤时，才用埋点表 T-007 对 anon_id 去重。
    table: T-005
    type: atomic
    expr: SUM(dau)
    filters: ["全站：client_type = '汇总' AND country = '汇总' AND borderline_tag = '汇总'", "p_date = TO_CHAR(stat_date,'yyyymmdd')"]
    unit: 人
    aggregation: total
    traps: [P-26]
    status: pending_review
    owner: 数据组
    evidence: ["20261031：143,308；埋点 anon_id 自算为 144,168（差 0.6%）", "R1 用户域 Q1 DS"]

  - id: M-USR-003
    name: 访客注册转化率
    synonyms: [注册转化率, 访客注册率, 新注册转化率]
    definition: 当日注册用户数（M-USR-001，用户画像表）÷ 当日访客 UV。分母默认用 T-005 dau；用埋点表对 anon_id 去重也可以，DS 认为两者都行（R1 用户域 Q4），交付时注明用的哪个。
    table: T-009
    type: ratio
    expr: M-USR-001 / M-USR-002
    numerator: M-USR-001
    denominator: M-USR-002
    filters: ["分子分母同一天、同一端范围"]
    disclaimer: 当日新注册账号数与访客总量的比率，不是逐访客关联的注册漏斗。“访问注册率”有历史歧义，未明确语义时须确认指本指标还是 M-USR-009。
    unit: "%"
    aggregation: rate
    status: pending_review
    owner: 数据组
    reviewed_by: DS
    reviewed_at: 2026-11-26
    evidence: ["Q3 口径说明；R1 用户域 Q4 DS", "Section 06 DS：两个比率都保留，原公式及 ID 不变，名称改为访客注册转化率", "2026-11-26 实跑：20261031 注册36769 / 访客143308 = 25.6573%，20261124 为22.5855%；画像快照20261125，SQL和结果见 L5_evals/evidence/section06_user_ratios.sql 及JSON"]

  - id: M-USR-004
    name: 期间新客登录DAU
    synonyms: [新客DAU, 新用户DAU, 当日新客DAU]
    definition: 登录 DAU 按 D-004 当日新老或 D-005 期间新老拆分，必须写明是哪一种（R0 B-06）。
    table: T-002
    type: derived
    expr: COUNT(DISTINCT user_id) WHERE 新老标签 = '当日新' / '期间新'
    filters: ["is_active = 1", "JOIN L2_dimensions.shared_cte.signup"]
    unit: 人
    aggregation: total
    dimensions: [D-004, D-005]
    traps: [P-24]
    status: pending_review
    owner: 数据组
    evidence: ["R0 B-06/U4"]

  - id: M-USR-005
    name: 滚动30日访客活跃数
    synonyms: [MAU, 月活, 30日活跃, 滚动30日活跃]
    definition: 统计日及之前 29 天 [t-29,t] 的活跃访客去重数，沿用 T-005 的数仓加工。它是访客口径的滚动窗口，不是自然月，也不是登录账号 MAU；Section 07 已确认纳入一期。
    table: T-005
    type: atomic
    expr: SUM(mau)   -- 三个维度钉住为 '汇总'
    filters: ["client_type = '汇总' AND country = '汇总' AND borderline_tag = '汇总'", "p_date = TO_CHAR(stat_date,'yyyymmdd')"]
    unit: 人
    aggregation: snapshot
    traps: [P-26]
    disclaimer: 用户只说“月活/MAU”但未说明人群或窗口时先确认；不把本指标自动解释为自然月登录账号 MAU。全站与分端都必须钉住 T-005 汇总维度。
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: 2026-11-26
    evidence: ["CNB bigdata_etl 生产 SQL：MAU = [t-29,t] 30 天窗口访客去重", "Section 07 DS：纳入一期，采用滚动30日访客活跃数", "2026-11-26 实跑全站样本：20261031 为 2,991,757；结果见 L5_evals/evidence/section07_user_retention_sample_result.json"]

  - id: M-USR-006
    name: 活跃在订用户数
    synonyms: [活跃订阅用户, 当日活跃的在订用户]
    definition: 当日活跃的在订用户，直接取数仓 T-005 的 subscribed_active_user_cnt（R1 用户域 C3）。
    table: T-005
    type: atomic
    expr: SUM(subscribed_active_user_cnt)
    filters: ["全站：client_type = '汇总' AND country = '汇总' AND borderline_tag = '汇总'", "p_date = TO_CHAR(stat_date,'yyyymmdd')"]
    unit: 人
    aggregation: total
    traps: [P-26]
    status: pending_review
    owner: 数据组
    evidence: ["20261031：11,244", "R1 用户域 C3 DS"]

  - id: M-USR-007
    name: 访客Dn点位留存率
    synonyms: [次日留存, 留存率, D1留存, D3留存, D7留存, 访客留存, 点位留存]
    definition: 统计日当天访客（dau 群）中，恰好第 N 天回访的比例，N 一期收 D1/D3/D7；分母为同一行 dau。不是新注册留存、登录账号留存或 N 日内至少回访一次的窗口留存。Section 07 已确认纳入一期。
    table: T-005
    type: ratio
    expr: SUM(retain_{N}d) / SUM(dau)   -- 同一行；三个维度钉住
    filters: ["client_type = '汇总' AND country = '汇总' AND borderline_tag = '汇总'", "stat_date + N ≤ 昨日（未成熟为 NULL）"]
    unit: "%"
    aggregation: rate
    traps: [P-26]
    disclaimer: 只使用观察窗已结束的基期；未成熟的 retain_Nd 为 NULL，不填0。全站不拆端；分端时基期和回访必须同端。数仓旧登记表的 page_view 人群不是本指标。
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: 2026-11-26
    evidence: ["CNB bigdata_etl 生产 SQL：retain_Nd = dau 群第 N 日点位回访数", "Section 07 DS：纳入一期，采用访客 D1/D3/D7 点位留存", "2026-11-26 实跑：20261031 D1/D3/D7 为18.7052%/15.4255%/12.6601%；未成熟日 D3/D7 为 NULL"]

  - id: M-USR-008
    name: 注册访问UV
    synonyms: [注册访问 UV, 埋点登录账号访问UV, 创作渗透分母]
    definition: 当天产生有效埋点的去重登录账号数，所有有效事件都算访问。与付费墙日表的登录 DAU（M-PAY-012）分开。跨天相加为人日，不能作为期间去重用户数。
    table: T-007
    type: atomic
    expr: COUNT(DISTINCT CAST(uid AS STRING))   -- 必须按业务日分组
    filters: ["event_id IS NOT NULL", "uid IS NOT NULL", "uid <> ''", "p_date 与 TO_CHAR(event_time,'yyyymmdd') 同窗约束"]
    dedup_key: uid × CAST(event_time AS DATE)
    time_axis: event_time（UTC+8）
    unit: 人（跨天相加为人日）
    aggregation: total
    status: pending_review
    owner: 数据组
    reviewed_by: DS
    reviewed_at: 2026-11-26
    evidence: ["Section 02，2026-11-26 DS 已确认分母主表、按 uid 去重及事件过滤；待 K-102 远程核验"]

  - id: M-USR-009
    name: 访客登录占比
    synonyms: [访客登录比例, 已登录访客占比, 登录访客占比]
    definition: 同一统计日、同一汇总维度下，发生过登录行为的访客数 login_visitor_cnt ÷ 访客 UV dau；含老用户，不是新注册转化，也不能把 login_visitor_cnt 换成按 uid 去重的注册访问 UV。
    table: T-005
    type: ratio
    expr: CAST(SUM(login_visitor_cnt) AS DOUBLE) / NULLIF(SUM(dau), 0)   -- 每日按 stat_date 分组
    denominator: M-USR-002
    filters: ["client_type = '汇总'", "country = '汇总'", "borderline_tag = '汇总'", "p_date 与 TO_CHAR(stat_date,'yyyymmdd') 同窗约束"]
    time_axis: stat_date（UTC+8）
    unit: "%"
    aggregation: rate
    traps: [P-26, P-40]
    disclaimer: 全站默认取三个维度的汇总行；分端按表卡选一组不重叠端，不能把 APP 与 IOS/ANDROID 或 WEB 与子端相加。多日累计比率按访客人日加权，不作为期间去重访客的登录比例。“访问注册率”裸词需确认具体含义。
    status: pending_review
    owner: 数据组
    reviewed_by: DS
    reviewed_at: 2026-11-26
    evidence: ["Section 06 DS：保留 login_visitor_cnt / dau，单独命名为访客登录占比；与 M-USR-003 分开", "2026-11-26 实跑：20261031 登录访客86699 / 访客143308 = 60.4984%，20261124 为57.8300%；三个全站日样本见 L5_evals/evidence/section06_user_ratios_result.json；模板K-105"]
