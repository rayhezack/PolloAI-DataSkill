  - id: M-AD-010
    name: CPI
    synonyms: [单次安装成本, 安装成本]
    table: T-010
    type: ratio
    expr: M-AD-001 / M-AD-009   -- 仅 APP
    numerator: M-AD-001
    denominator: M-AD-009
    definition: App广告成本/安装数，独立于Web大盘注册CAC；App不在本轮实施范围。
    filters: ["source_end = 'APP'", "p_date与stat_date双约束、统计截到T-2；分子分母同批日期，先汇总再相除"]
    unit: USD/次
    aggregation: rate
    dimensions: [D-012]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10 APP：$277,681.43 / 212,809 = $1.30"]

  - id: M-AD-011
    name: 广告首购用户数
    synonyms: [首购用户, 广告首购人数]
    definition: 广告归因用户中，N 日内完成首购的用户数。另有 first_sub_*（首订）、first_api_*（API 首购）拆分；N=all 时用 first_purchase_user_cnt_all。
    table: T-010
    type: atomic
    expr: SUM(first_purchase_user_cnt_d{N})
    filters: ["p_date 与 stat_date 双约束", "统计截到 T-2；有限 N 还须 stat_date + N ≤ 昨日；all 为截至观测日累计，不称成熟终值"]
    unit: 人
    aggregation: total
    dimensions: [D-011, D-012]
    traps: [P-35]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10：d0 10,692 / all 13,903"]

  - id: M-AD-012
    name: 广告首购GMV
    synonyms: [首购GMV, 首购回收]
    table: T-010
    type: atomic
    definition: 仅支持 D0、D14、all；没有 D30 等首购 GMV 列；N=all 时用 first_purchase_gmv_usd_all。
    expr: SUM(first_purchase_gmv_usd_d{N})
    filters: ["p_date 与 stat_date 双约束", "统计截到 T-2；有限 N 还须 stat_date + N ≤ 昨日；all 为截至观测日累计，不称成熟终值"]
    unit: USD
    aggregation: total
    dimensions: [D-011, D-012]
    traps: [P-35]
    status: pending_review
    owner: 数据组
