# Section09：默认 T-010；注册日 cohort/D3/D7/支持的 campaign 下钻用 T-008。
# 已确认 CAC：WEB cost/reg_d0；APP cost/install。LTV/ROI 衔接待 Section10，广告全域尚未批准 pilot。
metrics:
  - id: M-AD-001
    name: 广告消耗
    synonyms: [投放消耗, 花费, spend, cost, 广告花费]
    table: T-010
    type: atomic
    expr: SUM(cost_usd)
    filters: ["p_date 与 stat_date 双约束", "p_date = TO_CHAR(stat_date,'yyyymmdd')；统计截到 T-2（P-39）"]
    unit: USD
    aggregation: total
    dimensions: [D-011, D-012, D-013, D-014]
    traps: [P-39]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10：$753,408.02（APP $277,681.43、WEB $475,726.59），与旧表各层级消耗合计一致"]

  - id: M-AD-002
    name: 展示数
    synonyms: [曝光, impressions, 展示量]
    table: T-010
    type: atomic
    expr: SUM(impressions)
    filters: ["p_date 与 stat_date 双约束", "p_date = TO_CHAR(stat_date,'yyyymmdd')；统计截到 T-2（P-39）"]
    unit: 次
    aggregation: total
    dimensions: [D-011, D-012, D-013, D-014]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10：61,197,737"]

  - id: M-AD-003
    name: 点击数
    synonyms: [clicks, 点击量]
    table: T-010
    type: atomic
    expr: SUM(clicks)
    filters: ["p_date 与 stat_date 双约束", "p_date = TO_CHAR(stat_date,'yyyymmdd')；统计截到 T-2（P-39）"]
    unit: 次
    aggregation: total
    dimensions: [D-011, D-012, D-013, D-014]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10：2,555,010"]

  - id: M-AD-004
    name: 广告注册用户数
    synonyms: [归因注册用户, 广告带来的注册, 投放注册数, 归因用户]
    definition: 投放注册用户数：注册日 − 投放日 ≤ N 天的人数，N = 0/14/30/60/90/180/360/all（生产 SQL）。只含投放用户，不含自然量，不等于全部新注册；N=all 时字段为 reg_user_cnt_all，不是 reg_user_cnt_dall。
    table: T-010
    type: atomic
    expr: SUM(reg_user_cnt_d{N})
    filters: ["p_date 与 stat_date 双约束", "统计截到 T-2；有限 N 还须 stat_date + N ≤ 昨日；all 为截至观测日累计，不称成熟终值"]
    unit: 人
    aggregation: total
    dimensions: [D-011, D-012, D-013]
    traps: [P-35]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10：d0 611,189 / d14 630,736 / d30 635,005 / all 636,316"]

  - id: M-AD-005
    name: 广告归因GMV（Dn）
    synonyms: [归因GMV, 广告GMV, D0 GMV, D14 GMV, D30 GMV, 回收金额]
    definition: 由广告渠道带到端内的用户的累计 GMV（R1 广告域 Q4 DS）。本表窗口从投放日起算：付款日 − 投放日 ∈ [0, N]（生产 SQL）；DS 描述的「自首次注册日起、D3/D7」是注册日 cohort 表 T-008 的口径（Section09 已确认两表分工）。毛额，不扣退款；不将注册日 D3/D7 当成投放日 D3/D7；N=all 时字段为 gmv_usd_all，不是 gmv_usd_dall。
    table: T-010
    type: atomic
    expr: SUM(gmv_usd_d{N})
    filters: ["p_date 与 stat_date 双约束", "统计截到 T-2；有限 N 还须 stat_date + N ≤ 昨日；all 为截至观测日累计，不称成熟终值"]
    unit: USD
    aggregation: total
    dimensions: [D-011, D-012, D-013]
    traps: [P-35, P-41]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10：d0 $353,883.09 / d14 $574,840.05 / d30 $656,987.32（2026-11-25 样本含未满 D30 日期，不是成熟 D30 总量）/ all $731,318.42"]

  - id: M-AD-006
    name: 广告LTV（Dn）
    synonyms: [LTV, 用户价值, 人均回收]
    definition: 原草案为归因 GMV_N ÷ 同窗口注册人数 reg_N。Section09 只确认 CAC 的固定分端分母，未批准变更 LTV；是否改用 Web D0 注册/App 安装待 Section10。不自动把本指标变成每安装回收。
    table: T-010
    type: ratio
    expr: M-AD-005 / M-AD-004
    numerator: M-AD-005
    denominator: M-AD-004
    filters: ["同 M-AD-005", "分端 × 广告平台汇总；P-41 可比平台；不混合不同成熟日期样本"]
    unit: USD/注册用户（草案）
    aggregation: rate
    dimensions: [D-011, D-012]
    traps: [P-35, P-38, P-41]
    open_question: OQ-22
    status: draft
    owner: 数据组
    evidence: ["Section09 CAC 新分母与原 LTV 分母不一致，不能约分；Section10 待评审"]

  - id: M-AD-007
    name: 获客成本 CAC
    synonyms: [CAC, 获客成本]
    definition: Section09 DS 确认：Web = SUM(cost_usd) / SUM(reg_user_cnt_d0)；App = SUM(cost_usd) / SUM(install_cnt)。分母固定，不随 Dn 改变。必须分端输出并标注 Web 美元/注册用户、App 美元/安装；不得合并成跨端统一 CAC。App 同范围 CAC 与 CPI 数值相同，不将此结论延伸为 LTV 的分母已获批准。
    table: T-010
    type: ratio
    expr: SUM(cost_usd) / NULLIF(CASE WHEN source_end='WEB' THEN SUM(reg_user_cnt_d0) WHEN source_end='APP' THEN SUM(install_cnt) END,0)
    numerator: M-AD-001
    denominator: WEB 的 SUM(reg_user_cnt_d0)；APP 的 M-AD-009
    filters: ["p_date = TO_CHAR(stat_date,'yyyymmdd') 且日期双约束", "统计截到 T-2（P-39）", "先按 source_end × ad_platform 汇总，分子分母同批日期", "WEB 平台仅 google/bing/yahoo/naver；APP 仅 meta/asa/tiktok，google 从20260401起（P-41）", "APP 2025年尚未校准，不纳入当前核验模板；模板从20260101起"]
    unit: WEB USD/注册用户；APP USD/安装
    aggregation: rate
    dimensions: [D-011, D-012]
    traps: [P-38, P-39, P-41]
    status: pending_review
    owner: 数据组
    reviewed_by: DS
    reviewed_at: "2026-11-27"
    evidence: ["review/Section09_广告域_表分工与CAC.md：分端固定分母；业务算法已确认，全域 pilot 与 SQL 验收另行评审", "K-107.sql；L5_evals/evidence/section09_cac.sql"]

  - id: M-AD-008
    name: 广告ROI（Dn）
    synonyms: [ROI, 回收率, 回本率, D0 ROI, D14 ROI, D30 ROI]
    definition: 历史 DS 定义为 LTV ÷ CAC。Section09 后 CAC 与原 LTV 分母不一致，不能继续声称该比率等于 GMV ÷ 消耗；ROI 与 ROAS 是否同义、LTV 是否调整，待 Section10。未定前不输出本指标，也不判断毛额回本。
    table: T-010
    type: ratio
    expr: M-AD-006 / M-AD-007
    numerator: M-AD-006
    denominator: M-AD-007
    filters: ["同 M-AD-005", "同 M-AD-007；分子分母同批成熟日期、投放端与广告平台"]
    unit: 比值（待评审）
    aggregation: rate
    dimensions: [D-011, D-012]
    traps: [P-35, P-38, P-41]
    open_question: OQ-22
    status: draft
    owner: 数据组
    evidence: ["Section09 新 CAC 不能与原 LTV 直接约分；历史 GMV/消耗数字不是 LTV/CAC 新定义的验证"]

  - id: M-AD-009
    name: 广告安装数
    synonyms: [安装, installs, 激活]
    definition: 只有 APP 投放有安装数，WEB 为空。
    table: T-010
    type: atomic
    expr: SUM(install_cnt)
    filters: ["p_date 与 stat_date 双约束", "统计截到 T-2（P-39）", "source_end = 'APP'"]
    unit: 次
    aggregation: total
    dimensions: [D-012]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10 APP：212,809"]

  - id: M-AD-010
    name: CPI
    synonyms: [单次安装成本, 安装成本]
    table: T-010
    type: ratio
    expr: M-AD-001 / M-AD-009   -- 仅 APP
    numerator: M-AD-001
    denominator: M-AD-009
    definition: 同范围下为 App CAC 的同值比率；若用于获客决策，沿用 M-AD-007 的日期、平台和历史覆盖限制。
    filters: ["source_end = 'APP'", "同 M-AD-007 的日期、平台、覆盖限制；分子分母同批行"]
    unit: USD/次
    aggregation: rate
    dimensions: [D-012]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10 APP：$277,681.43 / 212,809 = $1.30"]

  - id: M-AD-011
    name: 广告首购用户数
    synonyms: [首购用户, 广告首购人数]
    definition: 广告归因用户中，N 日内完成首购的用户数。另有 first_sub_*（首订）、first_api_*（API 首购）拆分；N=all 时用 first_purchase_user_cnt_all。
    table: T-010
    type: atomic
    expr: SUM(first_purchase_user_cnt_d{N})
    filters: ["p_date 与 stat_date 双约束", "统计截到 T-2；有限 N 还须 stat_date + N ≤ 昨日；all 为截至观测日累计，不称成熟终值"]
    unit: 人
    aggregation: total
    dimensions: [D-011, D-012]
    traps: [P-35]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10：d0 10,692 / all 13,903"]

  - id: M-AD-012
    name: 广告首购GMV
    synonyms: [首购GMV, 首购回收]
    table: T-010
    type: atomic
    definition: 仅支持 D0、D14、all；没有 D30 等首购 GMV 列；N=all 时用 first_purchase_gmv_usd_all。
    expr: SUM(first_purchase_gmv_usd_d{N})
    filters: ["p_date 与 stat_date 双约束", "统计截到 T-2；有限 N 还须 stat_date + N ≤ 昨日；all 为截至观测日累计，不称成熟终值"]
    unit: USD
    aggregation: total
    dimensions: [D-011, D-012]
    traps: [P-35]
    status: pending_review
    owner: 数据组
