    name: 广告消耗
    synonyms: [投放消耗, 花费, spend, cost, 广告花费]
    table: T-010
    type: atomic
    expr: SUM(cost_usd)
    filters: ["source_end='WEB'（本轮仅Web，App不包含）", "p_date 与 stat_date 双约束", "p_date = TO_CHAR(stat_date,'yyyymmdd')；统计截到 T-2（P-39）"]
    unit: USD
    aggregation: total
    dimensions: [D-011, D-012, D-013, D-014]
    traps: [P-39]
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: "2026-11-27"
    evidence: ["2026-10：$753,408.02（APP $277,681.43、WEB $475,726.59），与旧表各层级消耗合计一致"]

