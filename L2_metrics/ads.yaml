# Section09：默认 T-010；注册日 cohort/D3/D7/支持的 campaign 下钻用 T-008。
# 最新 DS 裁决：本次仅 Web；CAC=当天Web广告总成本/当天Web总注册（含自然渠道）。
# ROI 已删除，M-AD-008 编号保留为历史编号、不复用；ROAS 使用 M-AD-013。App不在本轮范围。
metrics:
  - id: M-AD-001
    name: 广告消耗
    synonyms: [投放消耗, 花费, spend, cost, 广告花费]
    table: T-010
    type: atomic
    expr: SUM(cost_usd)
    filters: ["source_end='WEB'（本轮仅Web，App不包含）", "p_date 与 stat_date 双约束", "p_date = TO_CHAR(stat_date,'yyyymmdd')；统计截到 T-2（P-39）"]
    unit: USD
    aggregation: total
    dimensions: [D-011, D-012, D-013, D-014]
    traps: [P-39]
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: "2026-11-27"
    evidence: ["2026-10：$753,408.02（APP $277,681.43、WEB $475,726.59），与旧表各层级消耗合计一致"]

  - id: M-AD-002
    name: 展示数
    synonyms: [曝光, impressions, 展示量]
    table: T-010
    type: atomic
    expr: SUM(impressions)
    filters: ["p_date 与 stat_date 双约束", "p_date = TO_CHAR(stat_date,'yyyymmdd')；统计截到 T-2（P-39）"]
    unit: 次
    aggregation: total
    dimensions: [D-011, D-012, D-013, D-014]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10：61,197,737"]

  - id: M-AD-003
    name: 点击数
    synonyms: [clicks, 点击量]
    table: T-010
    type: atomic
    expr: SUM(clicks)
    filters: ["p_date 与 stat_date 双约束", "p_date = TO_CHAR(stat_date,'yyyymmdd')；统计截到 T-2（P-39）"]
    unit: 次
    aggregation: total
    dimensions: [D-011, D-012, D-013, D-014]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10：2,555,010"]

  - id: M-AD-004
    name: 广告注册用户数
    synonyms: [归因注册用户, 广告带来的注册, 投放注册数, 归因用户]
    definition: 投放注册用户数：注册日 − 投放日 ≤ N 天的人数，N = 0/14/30/60/90/180/360/all（生产 SQL）。只含投放用户，不含自然量，不等于全部新注册；N=all 时字段为 reg_user_cnt_all，不是 reg_user_cnt_dall。
    table: T-010
    type: atomic
    expr: SUM(reg_user_cnt_d{N})
    filters: ["p_date 与 stat_date 双约束", "统计截到 T-2；有限 N 还须 stat_date + N ≤ 昨日；all 为截至观测日累计，不称成熟终值"]
    unit: 人
    aggregation: total
    dimensions: [D-011, D-012, D-013]
    traps: [P-35]
    status: pending_review
    owner: 数据组
    evidence: ["2026-10：d0 611,189 / d14 630,736 / d30 635,005 / all 636,316"]

  - id: M-AD-005
    name: 广告归因GMV（Dn）
    synonyms: [归因GMV, 广告GMV, D0 GMV, D14 GMV, D30 GMV, 回收金额]
    definition: 由广告渠道带到端内的用户的累计 GMV（R1 广告域 Q4 DS）。本表窗口从投放日起算：付款日 − 投放日 ∈ [0, N]（生产 SQL）；DS 描述的「自首次注册日起、D3/D7」是注册日 cohort 表 T-008 的口径（Section09 已确认两表分工）。毛额，不扣退款；不将注册日 D3/D7 当成投放日 D3/D7；N=all 时字段为 gmv_usd_all，不是 gmv_usd_dall。
    table: T-010
    type: atomic
    expr: SUM(gmv_usd_d{N})
    filters: ["source_end='WEB'（本轮仅Web，App不包含）", "p_date 与 stat_date 双约束", "统计截到 T-2；有限 N 还须 stat_date + N ≤ 昨日；all 为截至观测日累计，不称成熟终值"]
    unit: USD
    aggregation: total
    dimensions: [D-011, D-012, D-013]
    traps: [P-35, P-41]
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: "2026-11-27"
    evidence: ["2026-10：d0 $353,883.09 / d14 $574,840.05 / d30 $656,987.32（2026-11-25 样本含未满 D30 日期，不是成熟 D30 总量）/ all $731,318.42"]

  - id: M-AD-006
    name: Web广告LTV（Dn）
    synonyms: [LTV, 用户价值, 人均回收]
    definition: Section10 DS已明确：Web LTV_N = SUM(GMV_N)/SUM(D0注册数)。分母固定为T-010的reg_user_cnt_d0，不随N变化。GMV从投放日起算；该表GMV含晚注册用户，结果按本库已确认的每D0归因注册回收解释。与Web大盘CAC采用不同分母，不计算ROI。
    table: T-010
    type: ratio
    expr: SUM(gmv_usd_d{N}) / NULLIF(SUM(reg_user_cnt_d0),0)
    numerator: M-AD-005
    denominator: SUM(reg_user_cnt_d0)（固定D0广告归因注册，不是M-USR-001大盘注册）
    filters: ["source_end='WEB'；App本轮不纳入", "同 M-AD-005 的日期与成熟窗口；N=all时用gmv_usd_all", "按广告平台先汇总再相除；P-41可比Web平台"]
    unit: USD/D0广告归因注册用户
    aggregation: rate
    dimensions: [D-012]
    traps: [P-35, P-38, P-41]
    disclaimer: 本库LTV按投放日GMV_N/D0归因注册定义，不改成注册日起算或改用大盘注册分母。App本轮不实施；试用范围见Section11；SQL生产核验待补，业务公式已确认，不再要求重复评审。
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: "2026-11-27"
    evidence: ["Section10最新原文：LTV的分子和分母是GMV_N和D0注册数；仅Web、删除ROI", "K-109.sql按已确认公式编写；section11_web_ltv_roas_check.json记录本地检查通过、远程连接超时"]

  - id: M-AD-007
    name: Web大盘注册获客成本 CAC
    synonyms: [CAC, 获客成本, 大盘总CAC, Web CAC, Web注册获客成本]
    definition: 当天Web全部广告成本 / 当天Web总注册用户数。分子取T-010的source_end=WEB全部广告平台成本；分母沿用M-USR-001注册定义，另限定T-009的reg_platform=WEB，包含自然和广告渠道，排除内部用户并按user_id去重。App和UNKNOWN不纳入。不是只用广告归因注册，也不是安装分母；期间用总成本/总注册，不能平均每日CAC。
    table: T-010
    type: ratio
    expr: M-AD-001 / M-USR-001
    numerator: M-AD-001
    denominator: M-USR-001
    filters: ["成本：source_end='WEB'；所有广告平台，不套用ROAS的P-41白名单", "注册：画像昨日快照，reg_platform='WEB'、is_registered=1、COALESCE(is_internal_user_da,0)<>1，COUNT(DISTINCT user_id)", "按成本日和注册日对齐同一北京时间自然日/期间，先各自汇总再关联", "成本日期双约束并截到T-2（P-39）；注册日期同窗", "缺失任一侧或分母为0时CAC返回NULL；标明画像快照日"]
    time_axis: 广告成本按花费日，注册按注册日；成本源沿账户时区，日期按数仓stat_date对齐，不宣称逐用户同批归因。
    unit: USD/Web注册用户
    aggregation: rate
    traps: [P-39]
    disclaimer: 仅Web，包含自然注册的大盘经营比率；不等于逐广告归因获客成本。渠道CAC另见M-AD-014：分母必须用该渠道注册，不能将全Web注册重复用作各平台获客分母。
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: "2026-11-27"
    evidence: ["DS于2026-11-27明确：大盘总广告成本/当天总注册；随后限定仅Web、App暂不包含，覆盖Section09旧分端方案", "K-107.sql；L5_evals/evidence/section10_web_cac.sql及结果"]

  - id: M-AD-009
    name: 广告安装数
    synonyms: [安装, installs, 激活]
    definition: 只有 APP 投放有安装数，WEB 为空。
    table: T-010
    type: atomic
    expr: SUM(install_cnt)
    filters: ["p_date 与 stat_date 双约束", "统计截到 T-2（P-39）", "source_end = 'APP'"]
