  - id: M-AD-013
    name: Web广告归因毛额回收率 ROAS（Dn）
    synonyms: [ROAS, 广告回收率, 广告回本率, D0 ROAS, D14 ROAS, D30 ROAS]
    definition: Section10 DS确认GMV_N/广告成本；本轮仅Web。分子分母共用相同投放日期、端和广告平台，有限N只用成熟日期。窗口从投放日算；金额不扣退款、拒付、佣金等，100%仅表示毛额覆盖广告花费。与大盘CAC不同，不把P-41限制套到大盘CAC。
    table: T-010
    type: ratio
    expr: M-AD-005 / M-AD-001
    numerator: M-AD-005
    denominator: M-AD-001
    filters: ["source_end='WEB'；App本轮不纳入", "p_date与stat_date双约束且截到T-2；有限N满足stat_date+N<=昨日；all为截至观测日累计", "仅google/bing/yahoo/naver（P-41）；先按平台汇总再相除", "成本和GMV同批日期；跨N曲线用最大N的成熟日期固定样本；零成本返回NULL"]
    unit: 比值（1=100%）
    aggregation: rate
    dimensions: [D-012]
    traps: [P-35, P-38, P-39, P-41]
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: "2026-11-27"
    evidence: ["Section10 DS：ROAS=SUM(GMV_N)/SUM(cost_usd)；最新指令删除ROI，本轮仅Web", "原M-AD-008已删除且编号不复用；K-109本地边界检查通过，成熟样本远程核验连接超时待补"]

  - id: M-AD-014
    name: Web广告渠道注册获客成本 CAC
    synonyms: [渠道CAC, 广告渠道CAC, Google渠道CAC, 按渠道注册获客成本]
    definition: 同一Web广告渠道在统计日/期间的广告成本 / 该渠道同日/期间的注册用户数。分子分母必须对应同一渠道或同一组广告渠道，不包含其他渠道与自然注册。单渠道按ad_platform汇总；广告渠道合计先合计对应渠道成本和注册再相除，不平均渠道CAC。大盘总CAC仍为M-AD-007，不能混用。
    table: T-008
    type: ratio
    expr: SUM(cost_usd) / NULLIF(SUM(cohort_user_cnt),0)
    denominator: 该渠道当天/同期广告归因注册人数（T-008 cohort_user_cnt）
    filters: ["source_end='WEB'，同一ad_platform/同一组广告平台", "product_type='ALL' AND is_first_purchase='汇总'，保留所有match_level", "p_date与stat_date双约束，统计截到T-2；成本和注册使用同一日期范围", "先按渠道聚合再相除；不与全Web注册明细关联，不用大盘注册作分母"]
    time_axis: 成本按花费日、注册按注册日；沿用同日/同期比率，不替换成投放日D0注册。
    unit: USD/渠道注册用户
    aggregation: rate
    dimensions: [D-012]
    traps: [P-33, P-34, P-38]
    disclaimer: Section11已确认分母必须是该渠道注册。复用已纳入的注册日表；来源的内部账号处理与成本一致性仍需技术核查。K-110尚未远程核验，不能将模板称为已执行证据；成本缺失不得解释为免费获客。
    status: pending_review
    owner: 数据组
    reviewed_by: DS
    reviewed_at: "2026-11-27"
    evidence: ["Section11 DS原文：广告渠道CAC分母应看广告渠道注册用户数，而不是大盘注册", "CNB main@29f9758 注册日表生产说明：cohort_user_cnt按注册日、cost_usd按花费日，平台总量保留全部match_level", "K-110.sql：待生产核验；已评审的业务公式与技术执行证据分开记录"]
