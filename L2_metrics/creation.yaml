# 创作域指标。层级参照 R0 B-11 DS SQL：任务 → 请求 → 成功 → 采纳；作品数和积分另算。
# 任务创建日指标默认 is_valid_task=1 与 p_date/created_time 双约束；匹配链路和当天采纳另读各指标 filters。
metrics:
  - id: M-CRE-001
    name: 创作任务数
    synonyms: [任务数, 生成任务数, 有效任务数, 生成次数]
    table: T-006
    type: atomic
    expr: COUNT(DISTINCT record_id)
    filters: ["is_valid_task = 1", "p_date 与 CAST(created_time AS DATE) 双约束"]
    dedup_key: record_id
    unit: 个
    aggregation: total
    dimensions: [D-007, D-008, D-009, D-004, D-005]
    status: pending_review
    owner: 数据组
    evidence: ["R0 B-11 DS SQL：task_cnt", "2026-10：7,896,614"]

  - id: M-CRE-002
    name: 请求任务数
    synonyms: [提交任务数, 请求数]
    definition: 已提交给生成厂商的任务。目标口径：数仓在创作任务表新增「是否已提交给厂商」标志列（有提交时间或有厂商任务 ID 即算，含语音转写，不含导演模式导出等内部渲染），直接数该列（DW-04）。该列上线前用 submit_time 非空临时代替。
    disclaimer: 临时口径。语音转写已发给厂商但 submit_time 恒为空，会被漏算（11-05 起每天几百个）；导演模式导出不经厂商，不计入是对的。
    table: T-006
    type: atomic
    expr: COUNT(DISTINCT CASE WHEN submit_time IS NOT NULL THEN record_id END)
    filters: ["is_valid_task = 1", "p_date 与 CAST(created_time AS DATE) 双约束"]
    dedup_key: record_id
    unit: 个
    aggregation: total
    dimensions: [D-007, D-008, D-009]
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: 2026-11-26
    evidence: ["Section 04，2026-11-26 DS：确认当前口径可带限制试用；生产字段核验待补", "R0 B-11 DS SQL：submit_task_cnt", "2026-10：7,351,742（占任务 93.1%）"]

  - id: M-CRE-003
    name: 成功任务数
    synonyms: [成功创作任务数, 生成成功数]
    table: T-006
    type: atomic
    expr: COUNT(DISTINCT CASE WHEN is_success_by_output = 1 THEN record_id END)
    filters: ["is_valid_task = 1", "p_date 与 CAST(created_time AS DATE) 双约束"]
    dedup_key: record_id
    disclaimer: 临时口径；旧加工对转写成功无作品的任务低估约 250 个/天。最新代码已修正，生产字段及历史回刷未核验（DW-05）；不得把代码提交视为生产数据已修复。
    unit: 个
    aggregation: total
    dimensions: [D-007, D-008, D-009]
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: 2026-11-26
    evidence: ["Section 04，2026-11-26 DS：确认当前口径可带限制试用；生产字段核验待补", "R0 B-11 DS SQL：success_task_cnt", "2026-10：6,946,038（占任务 88.0%）"]

  - id: M-CRE-004
    name: 采纳任务数
    synonyms: [被采纳任务数]
    definition: 3 日内至少有一个作品被下载、分享或复用的任务，按任务创建日归属。不要求任务创建满 3 天，不额外标成熟期。Section 04 已确认继续使用。
    table: T-006
    type: atomic
    expr: COUNT(DISTINCT CASE WHEN create_date_adopted_output_cnt_3d > 0 THEN record_id END)
    filters: ["is_valid_task = 1", "p_date 与 CAST(created_time AS DATE) 双约束"]
    dedup_key: record_id
    unit: 个
    aggregation: total
    dimensions: [D-007, D-008, D-009]
    traps: [P-27]
    disclaimer: 3 日采纳的业务定义已评审，不加成熟期限制。最新源代码字段名为 create_date_adopted_output_cnt_3d，生产列迁移待核验；查询失败不得自行改成当天采纳或猜测别名。
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: 2026-11-26
    evidence: ["Section 04，2026-11-26 DS：确认当前口径可带限制试用；生产字段核验待补", "R0 B-11 DS SQL：adopted_task_cnt", "2026-10：2,745,317"]

  - id: M-CRE-005
    name: 成功作品数
    synonyms: [成功输出作品数, 产物数, 作品数]
    table: T-006
    type: atomic
    expr: SUM(success_output_cnt)
    filters: ["is_valid_task = 1", "p_date 与 CAST(created_time AS DATE) 双约束"]
    unit: 件
    aggregation: total
    dimensions: [D-007, D-008, D-009]
    status: pending_review
    owner: 数据组
    evidence: ["R0 B-11 DS SQL：success_output_cnt", "2026-10：9,201,758"]

  - id: M-CRE-006
    name: 3日采纳作品数
    synonyms: [采纳作品数, 采纳产物数]
    table: T-006
    type: atomic
    definition: 按任务创建日归属的 3 日采纳作品数；不要求创建满 3 天，不额外标成熟期。
    expr: SUM(create_date_adopted_output_cnt_3d)
    filters: ["is_valid_task = 1", "p_date 与 CAST(created_time AS DATE) 双约束"]
    unit: 件
    aggregation: total
    dimensions: [D-007, D-008, D-009]
    traps: [P-27]
    disclaimer: 最新源代码字段名为 create_date_adopted_output_cnt_3d，生产列迁移待核验；本指标按创建日归属，不替代当天采纳。
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: 2026-11-26
    evidence: ["Section 04，2026-11-26 DS：确认当前口径可带限制试用；生产字段核验待补", "R0 B-11（注释笔误已在 R0 I-2 更正）", "2026-10：3,078,159"]

  - id: M-CRE-007
    name: 积分消耗
    synonyms: [创作消耗积分, 消耗积分, credits 消耗]
    table: T-006
    type: atomic
    definition: 积分净消耗 = 消耗 − 返还。目标口径按 main@29f9758 为全部有效任务 SUM(credit_consume - return_credit)，其中 credit_consume 是扣减毛额。生产部署及回刷核验前，继续执行 DS 批准的成功任务临时口径（DW-01）。
    expr: SUM(CASE WHEN is_success_by_output = 1 THEN credit_consume END)   -- 临时口径
    filters: ["is_valid_task = 1", "p_date 与 CAST(created_time AS DATE) 双约束"]
    unit: 积分
    aggregation: total
    dimensions: [D-007, D-009]
    traps: [P-28, P-31]
    disclaimer: 临时口径（只算成功任务），交付时必须注明。原核查中任务表 return_credit 基本为 0；最新代码已改从积分流水取返还，但生产部署及历史回刷尚未核验，不可静默切换为全部任务毛额。
    status: pilot
    owner: 数据组
    reviewed_by: DS
    reviewed_at: 2026-11-26
    evidence: ["Section 04，2026-11-26 DS：确认当前口径可带限制试用；生产字段核验待补", "R0 B-11 DS SQL：credit_consume", "R1 创作域第 2 版 DS：修正前只算成功任务", "2026-10 临时口径：118,480,427（全部有效任务直接求和为 151,954,808，没扣掉已返还的积分）"]

  - id: M-CRE-008
    name: 创作用户数
    synonyms: [创作者数, 创作UV, 创作人数, 创作者]
    definition: 当期有 ≥1 个有效创作任务的去重用户；全站按同人去重（R0 C3）。
    table: T-006
    type: atomic
    expr: COUNT(DISTINCT user_id)
    filters: ["is_valid_task = 1", "p_date 与 CAST(created_time AS DATE) 双约束"]
    dedup_key: user_id
    unit: 人
    aggregation: total
    dimensions: [D-007, D-008, D-004, D-005]
    traps: [P-17, P-32]
    status: pending_review
    owner: 数据组
    evidence: ["R0 C3", "20261031：28,827（用户×端 29,065）"]

  - id: M-CRE-009
    name: 创作渗透率
    synonyms: [创作率, 活跃创作率]
    definition: 大盘报表口径：当日创作用户数 ÷ 当日注册访问 UV（M-USR-008，埋点表按 uid 去重）。大盘不要求创作用户出现在埋点访问人群中；全站直接按用户去重，分端分别计算。
    table: T-006
    type: ratio
    expr: M-CRE-008 / M-USR-008   -- 大盘口径；期间按日计算后汇总，不把跨日用户直接去重为一个分母
    numerator: M-CRE-008
    denominator: M-USR-008
    filters: ["T-006: is_valid_task = 1，p_date 与 CAST(created_time AS DATE) 双约束", "T-007: event_id IS NOT NULL，uid IS NOT NULL 且 uid <> ''，p_date 与 CAST(event_time AS DATE) 双约束", "同一天、同一端范围；全站按 user_id/uid 各自去重"]
    unit: "%"
    aggregation: rate
    dimensions: [D-007, D-004]
    status: pending_review
    owner: 数据组
    evidence: ["Section 03 DS 回复：大盘直接用当日创作 UV / 当日登录访问 UV；创作主表继续用 T-006", "原 28,827 / 96,695 = 29.8% 使用旧分母，已不作为新口径证据"]

  - id: M-CRE-020
    name: 创作访问匹配用户数
    synonyms: [匹配创作UV, 访问用户创作UV, 创作链路匹配UV]
    definition: 分析口径：当天既有有效埋点访问（T-007，uid 非空）又有有效创作任务（T-006，is_valid_task=1）的去重用户数。分端分析必须按同一 platform_type 匹配；全站分析跨端后按 user_id 去重。
    table: T-007
    type: atomic
    expr: COUNT(DISTINCT uid) -- 与 T-006 按 user_id、业务日及端范围 INNER JOIN
    filters: ["T-007: event_id IS NOT NULL，uid IS NOT NULL 且 uid <> ''", "T-006: is_valid_task = 1", "同一业务日；分端时两表 platform_type 相同"]
    dedup_key: uid × CAST(event_time AS DATE)
    unit: 人
    aggregation: total
    dimensions: [D-007, D-004]
    status: pending_review
    owner: 数据组
    evidence: ["Section 03 DS 回复：分析创作链路需要以埋点登录访问 UV 为主表关联创作", "K-102 同时输出独立创作 UV 与匹配创作 UV，尚未远程执行"]

  - id: M-CRE-021
    name: 创作链路匹配渗透率
    synonyms: [匹配创作渗透率, 分析创作渗透率]
    definition: 分析口径：创作访问匹配用户数 ÷ 注册访问 UV。分端按同端访问与创作匹配；全站不考虑端差异，按用户去重。
    table: T-007
    type: ratio
    expr: M-CRE-020 / M-USR-008
    numerator: M-CRE-020
    denominator: M-USR-008
    filters: ["同一业务日、同一端范围", "分端时 T-007 与 T-006 的 platform_type 相同", "全站时跨端按用户去重"]
    unit: "%"
    aggregation: rate
    dimensions: [D-007, D-004]
    status: pending_review
    owner: 数据组
    evidence: ["Section 03 DS 回复：分析口径需关联登录访问 UV 与创作", "K-102 同时输出两种渗透率，尚未远程执行"]

