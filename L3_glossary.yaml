schema_version: 1
coverage: 当前覆盖 Section02/06 注册访问及两个访客比率、Section09~11广告CAC、LTV、ROAS和选表路由、Section14 Agent指标、Section12续费金额与用户续订率、Section13支付金额组成；其他术语继续查指标卡 synonyms，未命中按 README R7 回问。
usage: 先匹配 unsupported_terms，再匹配 ambiguous_terms、terms 和 table_routes；命中后仍须检查指标卡的状态、适用范围和过滤条件，不因术语可检索就视为 verified。
terms:
  - term: Agent访问用户数
    metric: M-AGT-001
    aliases: [Agent访问UV, Agent活跃用户]
    meaning: Agent有效事件下按用户×自然日去重；当前来源表TBD，指标定义先行。
    reviewed_source: review/Section14_Agent域_指标纳入与基建待办.md
  - term: Agent成功创作用户数
    metric: M-AGT-004
    aliases: [成功创作用户, Agent生成成功用户]
    meaning: 当天至少一个生成任务最终成功的去重用户数；Agent创作北极星，来源表TBD。
    reviewed_source: review/Section14_Agent域_指标纳入与基建待办.md
  - term: Agent归因GMV
    metric: M-AGT-010
    aliases: [Agent支付GMV, Agent收入]
    meaning: 订单级同日支付前最近一次提交回连Agent曝光的有效订单金额；App/Web分开，来源表TBD。
    reviewed_source: review/Section14_Agent域_指标纳入与基建待办.md
  - term: 访客注册转化率
    metric: M-USR-003
    aliases: [注册转化率, 访客注册率, 新注册转化率]
    meaning: 当日新注册用户数 ÷ 当日访客 UV
    reviewed_source: review/Section06_用户域_访问注册率命名.md
  - term: 访客登录占比
    metric: M-USR-009
    aliases: [访客登录比例, 已登录访客占比, 登录访客占比]
    meaning: login_visitor_cnt ÷ dau，含老用户，按访客口径
    reviewed_source: review/Section06_用户域_访问注册率命名.md
  - term: 注册访问UV
    metric: M-USR-008
    aliases: [注册访问 UV, 埋点登录账号访问UV, 创作渗透分母]
    meaning: 有效埋点中的非空 uid 按自然日去重，是账号数
    reviewed_source: review/Section02_创作域_注册访问UV.md
  - term: 获客成本 CAC
    metric: M-AD-007
    aliases: [CAC, 获客成本, 大盘总CAC, Web CAC, Web注册获客成本]
    meaning: 仅Web：全部付费渠道成本合计/全部付费渠道注册合计，排除自然注册；与渠道CAC使用同一批付费渠道来源，仅汇总层级不同。
    reviewed_source: review/Section11_广告域_Web试用范围.md
  - term: 广告ROAS
    metric: M-AD-013
    aliases: [ROAS, 广告回收率, 广告回本率]
    meaning: 本轮仅Web；同批成熟投放日期的广告归因GMV_N/广告成本，毛额回收，不表示利润。
    reviewed_source: review/Section10_广告域_LTV与ROI衔接.md
  - term: Web广告LTV
    metric: M-AD-006
    aliases: [LTV, 广告LTV, Web LTV]
    meaning: 本库定义为Web投放日起算的GMV_N/D0广告归因注册数；分母不随N变化，不用大盘CAC分母，不计算ROI。
    reviewed_source: review/Section10_广告域_LTV与ROI衔接.md
  - term: Web广告渠道CAC
    metric: M-AD-014
    aliases: [渠道CAC, 广告渠道CAC, Google渠道CAC]
    meaning: 该Web广告渠道当天/同期的广告成本/该渠道注册人数，不用整个Web注册作分母；同组渠道合计也须成本与注册范围对应。
    reviewed_source: review/Section11_广告域_Web试用范围.md
  - term: 当日续费金额
    metric: M-PAY-022
    aliases: [当日续费, 当天续费金额, 当日财务续费金额]
    meaning: renew_same_day_amount_usd直接求和，单位USD；不是人数比率。
    reviewed_source: review/Section12_支付域_财务续费率统计单位.md
  - term: 7日续费金额
    metric: M-PAY-023
    aliases: [7日续费, 7日财务续费金额, 续费金额, 续费GMV]
    meaning: renew_7d_amount_usd直接求和，单位USD，观察窗成熟；不是金额比率。
    reviewed_source: review/Section12_支付域_财务续费率统计单位.md
  - term: 当日续订率
    metric: M-PAY-024
    aliases: [当天续订率, 当日财务续订率]
    meaning: renew_same_day_user_cnt/expire_user_cnt；用户比例，含全续订类型。
    reviewed_source: review/Section12_支付域_财务续费率统计单位.md
  - term: 7日续订率
    metric: M-PAY-021
    aliases: [财务续订率, 全类型7日续订率]
    meaning: renew_7d_user_cnt/expire_user_cnt；用户比例，不是订阅数比例。
    reviewed_source: review/Section12_支付域_财务续费率统计单位.md
  - term: 支付GMV
    metric: M-PAY-001
    aliases: [GMV, 支付金额, 支付流水]
    meaning: 有效订单实付金额，包含税款和服务费，不扣退款，含API；不是扣税费或服务费后的收入。
    reviewed_source: review/Section13_支付域_GMV含税说明.md
  - term: 实收GMV
    metric: M-PAY-002
    aliases: [扣退款收入, 实收]
    meaning: 支付GMV减退款，仅扣退款，不额外扣税款或服务费，不等于净利润。
    reviewed_source: review/Section13_支付域_GMV含税说明.md
ambiguous_terms:
  - term: 续费率
    candidate_metrics: [M-PAY-022, M-PAY-023]
    action: follow_reviewed_amount_meaning
    prompt: Section12 DS用此词指定续费金额；默认分别返回当日/7日续费金额，单位USD，不标成百分比。若明确要求金额比率，现有回复未给分母，不能擅自除以到期应续金额。
  - term: 续订率
    candidate_metrics: [M-PAY-024, M-PAY-021, M-PAY-020, M-PAY-017]
    action: resolve_from_context
    prompt: 默认按全续订类型用户数/到期用户数分别给当日和7日；明确问自动续订/业务口径时用M-PAY-020/017。不能按订阅数计算。
  - term: CAC
    candidate_metrics: [M-AD-007, M-AD-014]
    action: resolve_from_context
    prompt: 大盘总CAC用M-AD-007，汇总全部Web付费渠道；某广告渠道CAC用M-AD-014。两者分母均排除自然注册，不再把大盘CAC解释为全Web注册分母。
  - term: 访问注册率
    candidate_metrics: [M-USR-003, M-USR-009]
    action: clarify
    prompt: 你指当日新注册用户数占访客的比率，还是发生过登录行为的访客占比？
table_routes:
  - intent: 默认广告消耗、投放日注册/GMV
    table: T-010
    window_origin: 投放日
    available_windows: [D0, D14, D30, D60, D90, D180, D360, all]
    reviewed_source: review/Section09_广告域_表分工与CAC.md
  - intent: 明确的注册cohort、注册日起算D3/D7、支持的campaign/adgroup下钻
    table: T-008
    window_origin: 注册日（用户/GMV）；消耗与安装分别按花费日/安装日
    available_windows: [D0, D3, D7, D14, D30, D60, D90, D180]
    guard: 明确问投放日D3/D7时先说明主表不支持，不能静默改注册日起算；成本比率及campaign归因另核验。
    reviewed_source: review/Section09_广告域_表分工与CAC.md
  - intent: Web大盘总CAC、Web注册获客成本
    table: T-008
    denominator_table: T-008
    metrics: [M-AD-007]
    guard: 成本与注册均取全部Web付费渠道，按同日/同期合计；不含自然注册，不使用T-009全Web注册。
    reviewed_source: review/Section11_广告域_Web试用范围.md
  - intent: 某Web广告渠道当天/同期注册CAC
    table: T-008
    metrics: [M-AD-014]
    guard: 使用注册日cohort_user_cnt与同渠道花费日成本，不能用T-009全Web注册替代；不把注册日人数当成投放日D0注册。SQL核验状态见K-110。
    reviewed_source: review/Section11_广告域_Web试用范围.md
unsupported_terms:
  - term: ROI
    aliases: [广告ROI, D0 ROI, D14 ROI, D30 ROI]
    action: explain_removed
    meaning: DS已删除内部ROI指标；不计算LTV/CAC，不自动将ROI映射为ROAS。ROAS使用M-AD-013。
    reviewed_source: review/Section10_广告域_LTV与ROI衔接.md
